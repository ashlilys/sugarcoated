<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sugarcoated - ashlilys</title>
    <link rel="icon" type="image/x-icon" href="cakeroll.png">
    
    <style>
        /* 1. Reset everything to ensure no hidden margins */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #fdf6f3;
            background-image: url('bakery_entrance.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* --- TOP NAV BAR (Matches Requests Board) --- */
        #top-bar {
            width: 100%;
            height: 40px;
            background-color: #ffdbdb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #f8a5a5;
            position: relative;
            z-index: 1000;
        }
        
        .nav-left, .nav-right { flex: 1; white-space: nowrap; }
        .nav-left { text-align: left; }
        .nav-right { text-align: right; }
        
        .nav-center {
            flex: 2;
            font-weight: bold;
            color: #d17a7a;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-align: center;
        }

        #top-bar a { text-decoration: none; color: #d17a7a; font-weight: bold; font-size: 14px; }
        #top-bar a:hover { color: #ff8b8b; }

        /* 3. The Content Box - Made much simpler */
        #main-content {
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .frosted-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            border: 3px dashed #f8a5a5;
            text-align: center;
            max-width: 900px;
        }

        /* 4. Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .char-card {
            background: #fff;
            border: 2px solid #f8a5a5;
            border-radius: 15px;
            padding: 15px;
            text-decoration: none;
            color: #333;
            display: block;
            transition: 0.3s;
        }
        .char-card:hover { transform: scale(1.05); background: #fff0f0; }
        .char-card img { width: 80px; height: 80px; display: block; margin: 0 auto 10px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="nav-left">
            <a href="index.html">← go to entrance</a>
        </div>
        <div class="nav-center">sugarcoated</div>
        <div class="nav-right">
            <a href="https://www.instagram.com/ashliliez/" target="_blank">my instagram: @ashlilys</a>
        </div>
    </div>

    <div id="main-content">
        <div class="frosted-box">
            <h1>Current Requests</h1>
            <div class="grid">
                <a href="chiikawa.html" class="char-card"><img src="chiikawa.png">Chiikawa</a>
                <a href="hachiware.html" class="char-card"><img src="hachiware.png">Hachiware</a>
                <a href="usagi.html" class="char-card"><img src="usagi.png">Usagi</a>
                <a href="momonga.html" class="char-card"><img src="momonga.png">Momonga</a>
                <a href="rakko.html" class="char-card"><img src="rakko.png">Rakko</a>
                <a href="kurimanju.html" class="char-card"><img src="kurimanju.png">Kuri-Manjū</a>
				<a href="furuhonya.html" class="char-card"><img src="furuhonya.png">Furuhonya</a>
            </div>
        </div>
    </div>

</body>
</html>
