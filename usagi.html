<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <title>sugarcoated - usagi</title>
    <link rel="icon" type="image/x-icon" href="cakeroll.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #game-container {
            width: 100vw; height: 100vh;
            background-image: url('bakery_interior.png');
            background-size: cover; background-position: center;
            background-attachment: fixed;
            animation: fadeInAnimation 1.5s ease-in;
            position: relative; overflow: hidden;
        }

        @keyframes fadeInAnimation { 0% { opacity: 0; } 100% { opacity: 1; } }
        
        /* Usagi's signature screen shake */
        @keyframes shake { 
            0% { transform: translate(1px, 1px); } 
            50% { transform: translate(-1px, -2px); } 
            100% { transform: translate(1px, 2px); } 
        }

        /* The hopping animation */
        @keyframes characterBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }

        .bounce {
            animation: characterBounce 0.3s ease;
        }
        
        /* nav bar */
        #top-bar { 
            width: 100%; height: 50px; background: #ffdbdb; 
            display: flex; align-items: center; padding: 0 20px; 
            border-bottom: 2px solid #f8a5a5; z-index: 1000; position: relative; 
        }
        .nav-left { flex: 1; text-align: left; }
        .nav-right { flex: 1; text-align: right; }
        .nav-center { 
            flex: 2; text-align: center; font-weight: bold; color: #d17a7a; 
            font-size: 18px; letter-spacing: 2px; text-transform: lowercase; 
            font-family: 'Courier New', Courier, monospace; 
        }
        
        #top-bar a { 
            text-decoration: none; color: #d17a7a; font-weight: bold; 
            font-size: 14px; font-family: 'Courier New', Courier, monospace; 
        }
        #top-bar a:hover { color: #ff8b8b; }

        /* character image */
        #character-img {
            position: absolute; 
            bottom: 250px; left: 50%; 
            transform: translateX(-50%); 
            height: 55vh; 
            max-height: 450px;
            z-index: 5;
        }

        /* dialogue */
        #dialogue-box {
            position: absolute; bottom: 30px; left: 5%; width: 90%; height: 220px;
            background: rgba(255, 255, 255, 0.95); border: 5px solid #f8a5a5;
            border-radius: 25px; padding: 30px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        #text { font-size: 22px; color: #555; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; }

        /* buttons */
        .btn {
            background: #f8a5a5; color: white; border: none; padding: 15px 30px;
            border-radius: 15px; cursor: pointer; font-family: 'Montserrat', sans-serif;
            font-weight: 600; font-size: 18px; margin-top: 10px; transition: 0.3s; z-index: 101;
        }
        .btn:hover { background: #ff8b8b; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar">
            <div class="nav-left"><a href="requests.html">← back to requests</a></div>
            <div class="nav-center">sugarcoated</div>
            <div class="nav-right">
                <a href="https://www.instagram.com/ashliliez/" target="_blank">my instagram: @ashliliez</a>
            </div>
        </div>

        <img id="character-img" src="usagi_neutral.png" alt="Usagi">

        <div id="dialogue-box">
            <p id="text">Usagi: "Ura! Po! Hya!"</p>
            <button id="main-btn" class="btn" onclick="nextOrder()">"What would you like, Usagi?"</button>
            <a id="kitchen-link" href="#" class="btn" style="display:none;" onclick="fadeOut(event)">"Coming right up!"</a>
        </div>
    </div>

    <script>
        let clickCount = parseInt(localStorage.getItem('usagiCount')) || 0;
        
        const orders = [
            { text: "Usagi: (points at a Cinnamon Roll)", food: "cinnamon_roll" },
            { text: "Usagi: (points at a Napoleon Cheesecake)", food: "napoleon_cheesecake" },
            { text: "Usagi: (lunges at you!) *CHOMP*", food: "baker_special" }
        ];

        function nextOrder() {
            // Trigger the bounce animation
            const charImg = document.getElementById('character-img');
            charImg.classList.add('bounce');
            setTimeout(() => {
                charImg.classList.remove('bounce');
            }, 300);

            // Update dialogue and link
            const current = orders[clickCount % orders.length];
            document.getElementById('text').innerText = current.text;
            document.getElementById('kitchen-link').href = "kitchen.html?order=" + current.food;
            
            // Toggle buttons
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('kitchen-link').style.display = 'block';
            
            // Trigger background shake (gets faster on the last click)
            const shakeIntensity = (clickCount % orders.length === 2) ? "0.1s" : "0.2s";
            document.getElementById('game-container').style.animation = "shake " + shakeIntensity + " infinite";
        }

        function fadeOut(event) {
            event.preventDefault();
            localStorage.setItem('usagiCount', ++clickCount);
            document.getElementById('game-container').style.transition = "opacity 0.5s ease";
            document.getElementById('game-container').style.opacity = "0";
            setTimeout(() => { window.location.href = event.target.href; }, 500);
        }
    </script>
</body>
</html>
